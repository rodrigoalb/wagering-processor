name: wagering

x-app: &app
  build: .
  restart: unless-stopped
  stop_grace_period: 30s
  depends_on:
    migrate:
      condition: service_completed_successfully
    localstack:
      condition: service_healthy
  environment: &app-env
    DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
    AWS_ENDPOINT_URL: http://localstack:4566
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    PORT: "3000"
    LOG_LEVEL: info

services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports: ["5440:5432"]
    volumes:
      - ./infra/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    # Fixado: a tag latest passou a exigir LOCALSTACK_AUTH_TOKEN.
    image: localstack/localstack:4.12
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports: ["4570:4566"]
    volumes:
      - ./infra/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 3s
      timeout: 3s
      retries: 40

  migrate:
    build: .
    command: ["bun", "run", "src/infrastructure/persistence/migrate.ts", "up"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
    depends_on:
      postgres:
        condition: service_healthy

  # Três instâncias: a solução precisa estar correta com múltiplas réplicas
  # disputando as mesmas wallets, a mesma fila e o mesmo outbox.
  app-1:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-1 }
    ports: ["3001:3000"]
  app-2:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-2 }
    ports: ["3002:3000"]
  app-3:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-3 }
    ports: ["3003:3000"]
